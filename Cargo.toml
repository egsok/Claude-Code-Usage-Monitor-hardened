[package]
name = "claude-code-usage-monitor"
version = "1.6.0"
edition = "2021"
license = "MIT"
description = "Security-hardened Claude Code usage monitor for Windows"
homepage = "https://github.com/egsok/Claude-Code-Usage-Monitor-hardened"
repository = "https://github.com/egsok/Claude-Code-Usage-Monitor-hardened"

[package.metadata.winres]
CompanyName = "Egor Sokolov"
ProductName = "Claude Code Usage Monitor Hardened"
FileDescription = "Claude Code Usage Monitor Hardened"
OriginalFilename = "claude-code-usage-monitor.exe"
InternalName = "ClaudeCodeUsageMonitorHardened"
Comments = "https://github.com/egsok/Claude-Code-Usage-Monitor-hardened"
LegalCopyright = "Original project Copyright (C) 2026 Code Zeno Pty Ltd; hardened fork changes Copyright (C) 2026 Egor Sokolov"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
