name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: claude-code-usage-monitor.exe
  WINGET_PACKAGE_ID: egsok.ClaudeCodeUsageMonitorHardened

jobs:
  dependency-security:
    uses: ./.github/workflows/dependency-security.yml
    permissions:
      contents: read

  build:
    needs: dependency-security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify tag and release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag does not match Cargo version" }
          if (-not (Test-Path ".github/release-notes/$env:RELEASE_TAG.md")) { throw "Missing release notes" }

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Test without live provider requests
        run: cargo test --locked --no-fail-fast

      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -A clippy::single-match -A clippy::manual-is-multiple-of -A clippy::too-many-arguments

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate checksum
        shell: pwsh
        run: |
          $file = "target/release/claude-code-usage-monitor.exe"
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  claude-code-usage-monitor.exe" | Set-Content -Encoding ascii target/release/SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Claude Code Usage Monitor Hardened ${{ github.ref_name }}
          files: |
            target/release/claude-code-usage-monitor.exe
            target/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: "false"

  winget:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: windows-latest
    env:
      WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
    steps:
      - name: Prepare release metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.RELEASE_ASSET_NAME }}"

          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_URL=$packageUrl" >> $env:GITHUB_ENV

      - name: Skip when winget token is not configured
        if: env.WINGETCREATE_GITHUB_TOKEN == ''
        shell: pwsh
        run: |
          Write-Warning "Skipping WinGet submission because WINGETCREATE_GITHUB_TOKEN is not configured."

      - name: Install .NET 6 runtime
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.0.x"

      - name: Download wingetcreate
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit WinGet manifest update
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          .\wingetcreate.exe update `
            --submit `
            --token $env:WINGETCREATE_GITHUB_TOKEN `
            --urls $env:PACKAGE_URL `
            --version $env:PACKAGE_VERSION `
            $env:WINGET_PACKAGE_ID
